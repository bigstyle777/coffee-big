name: coffee-big

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffee_big}
      MYSQL_USER: ${MYSQL_USER:-coffee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 中配置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-coffee_big}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_USER:-coffee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 中配置 MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中配置 JWT_SECRET}
      ADMIN_OPENID: ${ADMIN_OPENID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 不提供默认密码，必须在 .env 中设置 ADMIN_PASSWORD
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN_EXPIRE_HOURS: ${ADMIN_TOKEN_EXPIRE_HOURS:-12}
      UPLOAD_DIR: /app/uploads
      # 微信 AppID / AppSecret 必须由 .env 提供，不在仓库中保存
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      # 支付渠道：默认关闭模拟支付；本地演示请在 .env 中设置 PAY_MOCK_ENABLED=true
      PAY_PROVIDER: ${PAY_PROVIDER:-mock}
      PAY_MOCK_ENABLED: ${PAY_MOCK_ENABLED:-false}
      PAY_NOTIFY_URL: ${PAY_NOTIFY_URL:-}
      WX_MCH_ID: ${WX_MCH_ID:-}
      WX_API_V3_KEY: ${WX_API_V3_KEY:-}
      WX_MERCHANT_SERIAL_NUMBER: ${WX_MERCHANT_SERIAL_NUMBER:-}
      WX_PRIVATE_KEY_PATH: ${WX_PRIVATE_KEY_PATH:-}
      WX_PAY_PUBLIC_KEY_ID: ${WX_PAY_PUBLIC_KEY_ID:-}
      WX_PAY_PUBLIC_KEY_PATH: ${WX_PAY_PUBLIC_KEY_PATH:-}
    volumes:
      - coffee-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin:
    build:
      context: ./admin-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  coffee-uploads:
