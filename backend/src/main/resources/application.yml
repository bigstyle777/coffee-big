server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：等待正在处理的请求完成后再退出
  shutdown: graceful

spring:
  application:
    name: coffee-big-server
  profiles:
    # 默认使用 dev，生产环境通过 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 开启虚拟线程：@Async 任务将运行在虚拟线程上，无需引入任何消息队列
  threads:
    virtual:
      enabled: true
  # 商品图片上传大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 3s
  # 数据库结构与种子数据统一由 Flyway 管理，避免手工执行 SQL 造成环境漂移
  # baseline-on-migrate 允许已经手工建过表的旧库平滑接入
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    encoding: UTF-8
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除统一配置，对应各表的 deleted 字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
coffee:
  auth:
    # Token 有效期（小时），默认 7 天
    jwt-expire-hours: ${JWT_EXPIRE_HOURS:168}
    # 初始店长微信 openid：该用户首次登录后自动提升为 ADMIN
    # 配置一次并完成店长账号激活后，建议从环境变量中移除
    admin-openid: ${ADMIN_OPENID:}
  wechat:
    # 小程序 AppID 与 AppSecret 均通过环境变量提供，公开仓库不保存具体值
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    jscode2session-url: ${WX_JSCODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  order:
    # 待支付超时时间（分钟），超时后自动关单并回滚库存与优惠券
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:15}
  # 店长后台：仅在 sys_admin 表为空时使用初始账号创建
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    # 不提供默认密码，未配置 ADMIN_PASSWORD 时跳过自动创建
    default-password: ${ADMIN_PASSWORD:}
    token-expire-hours: ${ADMIN_TOKEN_EXPIRE_HOURS:12}
  # 商品图片本地存储
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-prefix: /uploads/
  # 支付渠道：mock-模拟支付 / wechat-微信支付
  pay:
    provider: ${PAY_PROVIDER:mock}
    # 默认关闭模拟支付；本地开发在 application-dev.yml 中开启
    mock-enabled: ${PAY_MOCK_ENABLED:false}
    notify-url: ${PAY_NOTIFY_URL:}
    wechat-app-id: ${WX_APP_ID:}
    wechat-mch-id: ${WX_MCH_ID:}
    wechat-api-v3-key: ${WX_API_V3_KEY:}
    wechat-merchant-serial-number: ${WX_MERCHANT_SERIAL_NUMBER:}
    wechat-private-key-path: ${WX_PRIVATE_KEY_PATH:}
    wechat-public-key-id: ${WX_PAY_PUBLIC_KEY_ID:}
    wechat-public-key-path: ${WX_PAY_PUBLIC_KEY_PATH:}

logging:
  level:
    com.coffee: info
